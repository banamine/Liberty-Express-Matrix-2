name: Daily Archive Harvester

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Harvester
        run: npx tsx server/news-builder.ts
        
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/daily-rundown.json
          git commit -m 'chore: daily rundown update [skip ci]' || echo "No changes to commit"
          git push
